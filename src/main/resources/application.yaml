spring:
  application:
    name: covenant-code-landing-service  # Имя приложения, используется в логах и метаданных

  config:
    activate:
      on-profile: dev  # Этот блок активен только при профиле "dev"

  datasource:
    url: jdbc:h2:mem:landing-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver  # Класс драйвера для подключения к базе H2
    # URL базы данных H2 в памяти
    # MODE=PostgreSQL — делает поведение H2 максимально похожим на Postgres
    # DB_CLOSE_DELAY=-1 — база не удаляется после закрытия соединения
    # DB_CLOSE_ON_EXIT=FALSE — база не закрывается при выходе из приложения
    username: sa  # Пользователь для подключения к H2
    password: ""  # Пароль для подключения (пустой)

  h2:
    console:
      enabled: true  # Включает веб-консоль H2 для просмотра данных
      path: /h2-console  # URL, по которому доступна консоль

  jpa:
    hibernate:
      ddl-auto: create  # Автоматическое обновление структуры базы по сущностям JPA
    show-sql: true  # Не выводить SQL-запросы в консоль (можно включить для отладки)
    properties:
      hibernate.format_sql: true

admin:
  default:
    username: admin
    password: admin

server:
  port: 8080  # Порт, на котором запускается приложение
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        name: MYAPP_SESSION

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod  # Этот блок активен только при профиле "prod"

  datasource:
    url: ${SPRING_DATASOURCE_URL}  # JDBC URL для Postgres, подставляется из переменной окружения
    username: ${SPRING_DATASOURCE_USERNAME}  # Имя пользователя Postgres из переменной окружения
    password: ${SPRING_DATASOURCE_PASSWORD}  # Пароль Postgres из переменной окружения

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true  # В продакшене должно быть true (требуется HTTPS)
        name: MYAPP_SESSION

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO