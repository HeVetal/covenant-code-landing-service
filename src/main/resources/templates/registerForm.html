<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RegisterForm</title>
</head>
<body>
<div style="display: none;">
    param.error: <span th:text="${param.error}">none</span><br>
    param.success: <span th:text="${param.success}">none</span>
</div>
<form th:action="@{/v1/registerForm}" th:object="${user}" method="post">
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red"></div>
    <label for="name">Имя: </label>
    <input type="text" id="name" th:field="*{name}"><br>

    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: red"></div>
    <label for="phone">Phone: </label>
    <input type="text" id="phone" th:field="*{phone}"><br>

    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red"></div>
    <label for="email">Email: </label>
    <input type="email" id="email" th:field="*{email}"><br>

    <div th:if="${#fields.hasErrors('message')}" th:errors="*{message}" style="color: red"></div>
    <label for="message">Message: </label>
    <textarea id="message" th:field="*{message}"></textarea><br>

    <button type="submit">Отправить</button>
</form>

<script th:if="${param.error}">
    alert("Что-то пошло не так, попробуйте повторить попытку позже")
</script>

<script th:if="${param.success}">
    alert("Форма успешно отправлена!");
    setTimeout(() => window.location.href = '/v1/success', 100);
</script>
</body>
</html>
