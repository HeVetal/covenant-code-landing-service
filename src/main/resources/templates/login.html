<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/logo.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>Вход в систему</h2>
        <p class="text-muted">Введите ваши учетные данные</p>
    </div>

    <!-- Сообщения об ошибках -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Неверное имя пользователя или пароль.
    </div>

    <div th:if="${logout}" class="alert alert-success" th:text="${logout}">
        Вы успешно вышли из системы.
    </div>

    <!-- Форма входа -->
    <form th:action="@{/v1/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя:</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Введите имя пользователя"
                   required
                   autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль:</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Введите пароль"
                   required>
        </div>

        <button type="submit" class="btn btn-primary btn-login">Войти</button>
    </form>

    <div class="register-link">
        <p>Нет аккаунта? <a th:href="@{/v1/registerForm}">Зарегистрироваться</a></p>
        <p><a th:href="@{/v1/layout}">Вернуться на главную</a></p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
