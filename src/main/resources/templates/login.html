<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-control {
            margin-bottom: 15px;
        }
        .btn-login {
            width: 100%;
            margin-bottom: 15px;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h2>Вход в систему</h2>
        <p class="text-muted">Введите ваши учетные данные</p>
    </div>

    <!-- Сообщения об ошибках -->
    <div th:if="${param.error}" class="alert alert-danger">
        Неверное имя пользователя или пароль.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        Вы успешно вышли из системы.
    </div>

    <!-- Форма входа -->
    <form th:action="@{/v1/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя:</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Введите имя пользователя"
                   required
                   autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль:</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Введите пароль"
                   required>
        </div>

        <button type="submit" class="btn btn-primary btn-login">Войти</button>
    </form>

    <div class="register-link">
        <p>Нет аккаунта? <a th:href="@{/v1/registerForm}">Зарегистрироваться</a></p>
        <p><a th:href="@{/v1/layout}">Вернуться на главную</a></p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
