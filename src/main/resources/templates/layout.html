<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CovenantCodeLanding</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <div class="header__inner">
        <img src="logo.svg" alt="Logo" class="header__logo">
        <nav class="header__nav">
            <a href="#about" class="header__link">О нас</a>
            <a href="#apply" class="header__link header__link--button">Отправить заявку</a>
        </nav>
    </div>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(html => {
                document.body.insertAdjacentHTML('beforeend', html);
            });
    </script>
</header>
</body>
</html>
