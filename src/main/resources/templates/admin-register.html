<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация администратора</title>
    <link rel="icon" th:href="@{/logo.svg}" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .register-header p {
            color: #718096;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .links {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background-color: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background-color: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .role-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            background: white;
            color: #4a5568;
            cursor: pointer;
        }

        .role-select:focus {
            outline: none;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .register-container {
                padding: 30px 20px;
            }

            .register-header h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-header">
        <h1>Регистрация администратора</h1>
        <p>Создайте новую учетную запись администратора</p>
    </div>

    <!-- Сообщения об успехе/ошибке -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}">
        Администратор успешно зарегистрирован!
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}">
        Ошибка при регистрации
    </div>

    <form th:action="@{/v1/admin/register}" th:object="${admin}" method="post">
        <!-- Имя пользователя -->
        <div class="form-group">
            <label for="username">Имя пользователя:</label>
            <input type="text"
                   id="username"
                   th:field="*{username}"
                   placeholder="Введите имя пользователя"
                   required>
            <div th:if="${#fields.hasErrors('username')}"
                 th:errors="*{username}"
                 class="error-message"></div>
        </div>

        <!-- Пароль -->
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="Введите пароль (минимум 6 символов)"
                   required>
            <div th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}"
                 class="error-message"></div>
        </div>

        <!-- Подтверждение пароля -->
        <div class="form-group">
            <label for="confirmPassword">Подтвердите пароль:</label>
            <input type="password"
                   id="confirmPassword"
                   th:field="*{confirmPassword}"
                   placeholder="Повторите пароль"
                   required>
            <div th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"
                 class="error-message"></div>
        </div>

        <!-- Роль -->
        <div class="form-group">
            <label for="role">Роль:</label>
            <select id="role" th:field="*{role}" class="role-select">
                <option value="ADMIN">Администратор</option>
                <option value="MODERATOR">Модератор</option>
                <option value="USER">Пользователь</option>
            </select>
            <div th:if="${#fields.hasErrors('role')}"
                 th:errors="*{role}"
                 class="error-message"></div>
        </div>

        <button type="submit" class="submit-btn">Зарегистрировать</button>
    </form>

    <div class="links">
        <a th:href="@{/admin/clients}">Вернуться в админку</a>
        <a th:href="@{/v1/layout}">На главную</a>
    </div>
</div>

<script th:src="@{/js/admin-register.js}"></script>
</body>
</html>
