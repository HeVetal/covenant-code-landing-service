<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin | Clients</title>
</head>
<body>

<h2>Список заявок</h2>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Email</th>
        <th>Статус</th>
        <th>Дата</th>
        <th>Действия</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="c : ${clients}">
        <td th:text="${c.name}">name</td>
        <td th:text="${c.phone}">phone</td>
        <td th:text="${c.email}">email</td>
        <td th:text="${c.status}">status</td>
        <td th:text="${c.createdAt}">createdAt</td>

        <td>
            <!-- Открыть: пока просто JSON по /admin/clients/{id} -->
            <a th:href="@{/admin/clients/{id}(id=${c.id})}">Открыть</a>

            <!-- Отработано -->
            <form th:action="@{/admin/clients/{id}/process(id=${c.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit"
                        th:disabled="${c.status != 'NEW'}">
                    Отработано
                </button>
            </form>

            <!-- Удалить -->
            <form th:action="@{/admin/clients/{id}/delete(id=${c.id})}"
                  method="post"
                  style="display:inline;"
                  onsubmit="return confirm('Удалить заявку?');">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
